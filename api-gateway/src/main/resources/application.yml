server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: backend-service
              uri: lb://backend-service
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5433/gateway
    username: admin
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

admin:
  key: super-admin-key

jwt:
  secret: my-secret-key-my-secret-key-my-secret-key-1234
  expiration-ms: 3600000
