server:
  port: 8080
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: classpath:keystore.p12
    key-store-password: pine1234!@#$
    key-store-type: PKCS12
    key-alias: apigw

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes: []   # 라우트는 DB에서 로드
      httpclient:
        response-timeout: 5000ms   # 전역 응답 타임아웃 (라우트별 timeout_ms로 개별 오버라이드 가능)
        connect-timeout: 3000      # 전역 연결 타임아웃 (ms)

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT_NUM:6379}

  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/gatewaydb
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:pine1234!@#$}

  sql:
    init:
      mode: never
#     mode: always

logging:
  level:
    com.example.apigateway.filter.SimpleCircuitBreakerFilter: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

gateway:
  name: DH-APIGW
  environment: DEV

rate-limit:
  requests-per-minute: 300
  whitelist-prefixes:          # Rate Limit 미적용 경로 prefix 목록
    - /console
    - /actuator
    - /registry
  trusted-proxies:   # X-Forwarded-For를 신뢰할 프록시 IP 목록 (nginx 등). 비어있으면 헤더 무시.
    - 127.0.0.1
    - 192.168.1.0/24
  auto-blacklist:
    enabled: true
    exceed-count: 5      # 연속 N번 한도 초과 시 자동 차단
    ttl-hours: 1         # 자동 차단 유지 시간

brute-force:
  enabled: true
  max-attempts: 5          # 로그인 실패 N회 연속 시 자동 차단
  block-hours: 1           # 차단 유지 시간
  window-minutes: 10       # 이 시간 내 실패 횟수 누적 (이후 자동 초기화)

circuit-breaker:
  window-size: 10           # 최근 N건 요청 기준으로 실패 횟수 집계
  failure-threshold: 5      # 윈도우 내 실패 N건 이상 시 OPEN
  open-duration-ms: 30000   # OPEN 유지 시간 (ms), 이후 HALF-OPEN

api-key:
  # 실제배포
#  enabled: true
  # 테스트
  enabled: false

jwt:
  enabled: true

auth:
  # 인증서버 주소 — 최초 기동 시 fallback 값으로만 사용됨.
  # 기동 시 DB(gateway_setting 테이블)에서 auth-server-url을 먼저 로드하며,
  # DB에 값이 있으면 이 값은 무시된다.
  # DB에 값이 없는 경우(최초 배포, DB 초기화 등) 이 값이 사용되므로 삭제하면 null이 될 수 있음.
  # 콘솔 UI > 인증 설정 탭에서 변경하면 DB에 영구 저장되어 이후 재시작에도 유지된다.
  server-url: http://192.168.1.183:10101

cors:
  # ERP 브라우저에서 /auth/session/validate 직접 호출을 허용할 origin (쉼표 구분)
  allowed-origins: http://localhost:5555

role-auth:
  enabled: true
  rules: []
  # 역할 제한이 필요한 경로는 아래처럼 추가
  # rules:
  #   - path: /admin/**
  #     roles:
  #       - ADMIN

# 헬스체크 설정
health-check:
  heartbeat-timeout-seconds: 30   # heartbeat 없으면 DOWN 처리
  active-check-interval-seconds: 15
  fail-threshold: 3               # 연속 N회 실패 시 DOWN
